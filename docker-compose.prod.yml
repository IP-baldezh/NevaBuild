services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: nevabuild
      POSTGRES_USER: nevabuild
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  nextjs:
    build: .
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nevabuild:${POSTGRES_PASSWORD}@postgres:5432/nevabuild
    volumes:
      - uploads:/app/uploads
    networks:
      - internal
      - web
    depends_on:
      - postgres

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/var/www/uploads:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - web
    depends_on:
      - nextjs

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot

volumes:
  postgres_data:
  uploads:
  certbot_certs:
  certbot_www:

networks:
  internal:
  web:
